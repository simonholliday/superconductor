<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Superconductor</title>
<link rel="stylesheet" href="/client/style.css">
<!--
	The panel's theme, applied before the first paint rather than when the app
	mounts.

	Deliberately not a module and deliberately not deferred: it has to run while
	the parser is still in the head, because the alternative is a flash of the
	wrong theme on every load for anybody who pinned one against their machine.
	That is the whole reason it is here and not in app.js, which sets the same
	attribute again on mount.

	Nothing stored means "match system", which leaves `prefers-color-scheme` in
	force. Storage throws outright in some privacy modes, so a failure here
	leaves the panel following the machine rather than leaving it blank.

	**Checked by shape rather than against a list of names.** This named light
	and dark when those were the only two; naming all eleven would make this a
	third copy of that list, after `app.js` and `style.css`, and the copy nobody
	edits is the one that silently reintroduces the flash for exactly the themes
	added last. The shape is the safety property the list was really providing:
	an unrecognised value can only ever be lowercase letters, so the worst it can
	do is name a `[data-theme]` block that does not exist, and the panel then
	paints the default — which is what a stored name from a newer build should do
	anyway. `app.js` sets the attribute again on mount and is the authority.
-->
<script>
	try {
		var pinned = localStorage.getItem("superconductor.theme");

		if (pinned && /^[a-z]+$/.test(pinned)) {
			document.documentElement.dataset.theme = pinned;
		}
	} catch (unavailable) {
		/* No storage, so no stored choice: the machine's answer stands. */
	}
</script>
</head>
<body>
<div id="panel"></div>
<script type="module" src="/client/app.js"></script>
</body>
</html>

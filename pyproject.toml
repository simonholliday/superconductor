[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superintendent"
description = "Touchscreen control surface for Subsequence, Subsample and Substation"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-FSL-1.1-ALv2"
# The vendored notices travel with the artefact, because they have to: the OFL
# requires the font's licence to accompany it, and Lucide's icon paths are
# inside `app.js` rather than in a file anybody would notice.
license-files = ["LICENSE", "licences/*"]
dynamic = ["version"]
dependencies = [
	"starlette>=0.37",
	"uvicorn>=0.30",
	"websockets>=14.0",
	"PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
	"mypy>=1.9",
	"pytest>=8.0",
	"pytest-asyncio>=0.23",
	"httpx>=0.27",
	"types-PyYAML",
	# Drives the page in a real browser. The browser itself is a separate
	# download ("playwright install firefox") and needs system libraries the
	# page tests skip cleanly without.
	"pytest-playwright>=0.5",
]

[project.scripts]
superintendent = "superintendent.cli:main"

[tool.setuptools]
packages = ["superintendent"]

# The page, its stylesheet, the vendored libraries and the bundled face are not
# Python, so they are carried as data.  Without this a built copy has nothing to
# serve.
#
# **Every directory has to be named.**  `client/*` does not reach into
# `client/fonts/`, so adding the face and not this line shipped a wheel that
# answered the font request with a 404 and silently fell back down the stack to
# whatever condensed face the machine happened to have.  Invisible to everyone
# developing and visible only to whoever installs — which is the same shape as
# the first review's finding that the client was not in the distributable at
# all, arriving a second time through a directory added later.
[tool.setuptools.package-data]
superintendent = ["client/*", "client/vendor/*", "client/fonts/*"]

[tool.setuptools_scm]
# Used when there is no git repository to read a version from — "git init" is
# Simon's call, and until it is made the version cannot be derived.
fallback_version = "0.0.0"

[tool.mypy]
# Kept off this directory: it is a CIFS mount shared between machines, which
# mypy's cache does not reliably tolerate, and a cache written on one machine
# has nothing to say to the other.
cache_dir = "/tmp/superintendent-mypy-cache"
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Off the mount, for the same reason as the mypy cache above.
cache_dir = "/tmp/superintendent-pytest-cache"
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superconductor"
description = "Touchscreen control surface for Subsequence, Subsample and Substation"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-FSL-1.1-ALv2"
# The vendored notices travel with the artefact, because they have to: the OFL
# requires the font's licence to accompany it, and Lucide's icon paths are
# inside `app.js` rather than in a file anybody would notice.
license-files = ["LICENSE", "licences/*"]
dynamic = ["version"]
dependencies = [
	"starlette>=0.37",
	"uvicorn>=0.30",
	"websockets>=14.0",
	"PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
	"mypy>=1.9",
	"pytest>=8.0",
	"pytest-asyncio>=0.23",
	"httpx>=0.27",
	"types-PyYAML",
	# The compositions are type-checked and tested along with the package, and
	# they read instrument definitions. It is not a dependency of the package —
	# nothing under `superconductor/` imports it, and nothing may (#1465) — but
	# mypy has needed it since `files` grew to cover `compositions/` and said so
	# only by not being run without it.
	"pymididefs[instruments]>=0.4",
	# Drives the page in a real browser. The browser itself is a separate
	# download ("playwright install firefox") and needs system libraries the
	# page tests skip cleanly without.
	"pytest-playwright>=0.5",
	# **The suite across every core: 126s to 25s** (measured here on 22 cores,
	# 2026-09-08, 555 passed either way). Nearly all of that is the 191 page
	# tests — the other 364 run in 1.2s — so this is really about parallelising
	# Playwright, and eight workers is where it was measured: the constraint is
	# a Firefox and a uvicorn per worker rather than cores.
	#
	# `--dist worksteal` rather than the default `load`, because the spread here
	# is extreme — a page test is most of a second and everything else is
	# microseconds — and a static queue leaves workers idle at the tail.
	#
	# **Deliberately not in `addopts`**, so a bare `pytest` stays serial. Worker
	# start-up is most of a one-test debugging run, and interleaved output is
	# worst on exactly the runs where reading it is the point.
	"pytest-xdist>=3.6",
]

[project.scripts]
superconductor = "superconductor.cli:main"

[tool.setuptools]
packages = ["superconductor"]

# The page, its stylesheet, the vendored libraries and the bundled face are not
# Python, so they are carried as data.  Without this a built copy has nothing to
# serve.
#
# **Every directory has to be named.**  `client/*` does not reach into
# `client/fonts/`, so adding the face and not this line shipped a wheel that
# answered the font request with a 404 and silently fell back down the stack to
# whatever condensed face the machine happened to have.  Invisible to everyone
# developing and visible only to whoever installs — which is the same shape as
# the first review's finding that the client was not in the distributable at
# all, arriving a second time through a directory added later.
[tool.setuptools.package-data]
superconductor = ["client/*", "client/vendor/*", "client/fonts/*"]

[tool.setuptools_scm]
# **The version is the git tag and is written nowhere.** `v0.1.0` builds `0.1.0`;
# any commit past a tag builds `0.0.1.devN+g<sha>`, and PyPI refuses a version
# carrying a local segment — so an untagged commit cannot be published even by
# accident. Measured by building both on 2026-09-08.
#
# The fallback is for a tree with no git history, which is not this repository
# any more but is still an ordinary way to arrive: a source zip from GitHub is
# not a clone, and without this `pip install .` would fail there. Requiring git
# to install is exactly the kind of thing #2049 refuses. `build.version()` reads
# 0.0.0 back as *unknown* rather than as a release, so nothing prints it.
fallback_version = "0.0.0"

[tool.mypy]
# Kept off this directory: it is a CIFS mount shared between machines, which
# mypy's cache does not reliably tolerate, and a cache written on one machine
# has nothing to say to the other.
cache_dir = "/tmp/superconductor-mypy-cache"
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

# Everything, not only the package.  4,160 lines were checked and 10,077 were
# not, and the unchecked ones included both halves of the restart safety net —
# `capture_state.py` and `restore_state.py`, whose whole justification is that
# losing a pattern happens silently.  Settled on 2026-09-06 (#2140).
files = ["superconductor", "tests", "tools", "compositions"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

# Subsequence ships no type information, and a composition is mostly a
# conversation with it.  Its absence is not a finding about this code.
[[tool.mypy.overrides]]
module = ["subsequence.*", "playwright.*", "pytest_asyncio.*"]
ignore_missing_imports = true

# **One check off, and only for the tests that drive a browser.**
# `warn_return_any` catches a real thing — handing back an unvalidated value as
# though it were typed — but a page test's every reading comes out of
# JavaScript, so the check fires on all of them and distinguishes none.  Fifteen
# casts round fifteen blocks of embedded JavaScript would add ceremony where the
# function's own annotation already says the expected shape.  Every other check
# stays on here, and the errors that were worth fixing were fixed rather than
# silenced.
[[tool.mypy.overrides]]
module = ["test_page", "test_client", "conftest"]
warn_return_any = false

[tool.pytest.ini_options]
# Off the mount, for the same reason as the mypy cache above.
cache_dir = "/tmp/superconductor-pytest-cache"
testpaths = ["tests"]
asyncio_mode = "auto"

# **A hung test names itself instead of the run simply never ending.**  Earned on
# 2026-09-08: a synchronous read of this CIFS mount, added inside the service's
# socket handler, deadlocked the suite.  It cost most of an hour — two runs killed
# on the guess that they were merely slow, a wrong theory about which files
# interacted, and a bisect — and what settled it in one command was this,
# which dumped every thread and pointed at the exact line.
#
# `faulthandler` is pytest's own, so it costs no dependency and nothing to pin.
#
# **120 seconds is chosen from both ends.**  The slowest thing here is a page test
# waiting on Playwright, whose own ceiling is 30s, so this is four times it and
# cannot fire on a cold browser or a slow mount; and the whole suite is about 130s,
# so a hang is caught while there is still a person watching.
faulthandler_timeout = 120
faulthandler_exit_on_timeout = true

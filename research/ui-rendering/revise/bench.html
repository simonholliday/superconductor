<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ui-rendering bench (prototype)</title>
<style>
  html, body { margin: 0; background: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif; }
  #stage { width: 1920px; height: 1080px; position: relative; overflow: hidden; }
  /* DOM grid */
  .grid { display: grid; width: 100%; height: 100%; gap: 2px; }
  .cell { background: #21262d; border-radius: 3px; }
  .cell.on { background: #d29922; }
  .cell.ph { background: #30363d; }
  .cell.on.ph { background: #ffd166; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* Research prototype for the Superintendent ui-rendering point. Not house style. */
const STAGE_W = 1920, STAGE_H = 1080;
const COL_OFF = [0x21, 0x26, 0x2d], COL_ON = [0xd2, 0x99, 0x22], COL_PH = [0x30, 0x36, 0x3d], COL_ONPH = [0xff, 0xd1, 0x66];

function layout(cells) {
  // 128 -> 16x8 ; 1024 -> 32x32
  const cols = cells === 128 ? 16 : 32;
  const rows = cells / cols;
  const gap = 2;
  const cw = Math.floor((STAGE_W - gap * (cols - 1)) / cols);
  const ch = Math.floor((STAGE_H - gap * (rows - 1)) / rows);
  return { cols, rows, gap, cw, ch };
}

function makeState(cells) {
  const on = new Uint8Array(cells);
  for (let i = 0; i < cells; i++) on[i] = Math.random() < 0.3 ? 1 : 0;
  return on;
}

// ---------- DOM ----------
function domRenderer(cells) {
  const L = layout(cells);
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.style.gridTemplateColumns = `repeat(${L.cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${L.rows}, 1fr)`;
  const els = [];
  for (let i = 0; i < cells; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    grid.appendChild(d); els.push(d);
  }
  stage.appendChild(grid);
  return {
    full(on, phCol) {
      for (let i = 0; i < cells; i++) {
        const c = i % L.cols;
        els[i].className = 'cell' + (on[i] ? ' on' : '') + (c === phCol ? ' ph' : '');
      }
    },
    incremental(on, phCol, prevCol, changed) {
      for (const i of changed) {
        const c = i % L.cols;
        els[i].className = 'cell' + (on[i] ? ' on' : '') + (c === phCol ? ' ph' : '');
      }
      for (let r = 0; r < L.rows; r++) {
        const a = r * L.cols + prevCol, b = r * L.cols + phCol;
        els[a].className = 'cell' + (on[a] ? ' on' : '');
        els[b].className = 'cell' + (on[b] ? ' on' : '') + ' ph';
      }
    },
  };
}

// ---------- SVG ----------
function svgRenderer(cells) {
  const L = layout(cells);
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', STAGE_W); svg.setAttribute('height', STAGE_H);
  const rects = [];
  for (let i = 0; i < cells; i++) {
    const r = document.createElementNS(NS, 'rect');
    const c = i % L.cols, row = Math.floor(i / L.cols);
    r.setAttribute('x', c * (L.cw + L.gap)); r.setAttribute('y', row * (L.ch + L.gap));
    r.setAttribute('width', L.cw); r.setAttribute('height', L.ch); r.setAttribute('rx', 3);
    r.setAttribute('fill', '#21262d');
    svg.appendChild(r); rects.push(r);
  }
  stage.appendChild(svg);
  const fill = (i, on, ph) => rects[i].setAttribute('fill', on ? (ph ? '#ffd166' : '#d29922') : (ph ? '#30363d' : '#21262d'));
  return {
    full(on, phCol) { for (let i = 0; i < cells; i++) fill(i, on[i], (i % L.cols) === phCol); },
    incremental(on, phCol, prevCol, changed) {
      for (const i of changed) fill(i, on[i], (i % L.cols) === phCol);
      for (let r = 0; r < L.rows; r++) { fill(r * L.cols + prevCol, on[r * L.cols + prevCol], false); fill(r * L.cols + phCol, on[r * L.cols + phCol], true); }
    },
  };
}

// ---------- Canvas 2D ----------
function canvasRenderer(cells) {
  const L = layout(cells);
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const cv = document.createElement('canvas');
  cv.width = STAGE_W; cv.height = STAGE_H;
  stage.appendChild(cv);
  const ctx = cv.getContext('2d');
  const rgb = (a) => `rgb(${a[0]},${a[1]},${a[2]})`;
  function cell(i, on, ph) {
    const c = i % L.cols, row = Math.floor(i / L.cols);
    ctx.fillStyle = rgb(on ? (ph ? COL_ONPH : COL_ON) : (ph ? COL_PH : COL_OFF));
    ctx.beginPath(); ctx.roundRect(c * (L.cw + L.gap), row * (L.ch + L.gap), L.cw, L.ch, 3); ctx.fill();
  }
  return {
    full(on, phCol) {
      ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, STAGE_W, STAGE_H);
      for (let i = 0; i < cells; i++) cell(i, on[i], (i % L.cols) === phCol);
    },
    incremental(on, phCol, prevCol, changed) {
      for (const i of changed) cell(i, on[i], (i % L.cols) === phCol);
      for (let r = 0; r < L.rows; r++) { cell(r * L.cols + prevCol, on[r * L.cols + prevCol], false); cell(r * L.cols + phCol, on[r * L.cols + phCol], true); }
    },
  };
}

// ---------- WebGL (instanced quads, one draw call) ----------
function webglRenderer(cells) {
  const L = layout(cells);
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const cv = document.createElement('canvas');
  cv.width = STAGE_W; cv.height = STAGE_H;
  stage.appendChild(cv);
  const gl = cv.getContext('webgl2', { antialias: false });
  if (!gl) throw new Error('no webgl2');
  const vs = `#version 300 es
    layout(location=0) in vec2 corner; layout(location=1) in vec2 pos; layout(location=2) in vec3 col;
    uniform vec2 size; uniform vec2 res; out vec3 vcol;
    void main(){ vec2 p = pos + corner*size; vec2 clip = (p/res)*2.0-1.0; gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0); vcol = col; }`;
  const fs = `#version 300 es
    precision mediump float; in vec3 vcol; out vec4 o; void main(){ o = vec4(vcol,1.0); }`;
  function sh(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.uniform2f(gl.getUniformLocation(prog, 'size'), L.cw, L.ch);
  gl.uniform2f(gl.getUniformLocation(prog, 'res'), STAGE_W, STAGE_H);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const corners = new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]);
  const cb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cb); gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const pos = new Float32Array(cells * 2);
  for (let i = 0; i < cells; i++) { pos[i*2] = (i % L.cols) * (L.cw + L.gap); pos[i*2+1] = Math.floor(i / L.cols) * (L.ch + L.gap); }
  const pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(1, 1);
  const cols = new Float32Array(cells * 3);
  const colb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, colb); gl.bufferData(gl.ARRAY_BUFFER, cols, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(2, 1);
  gl.clearColor(13/255, 17/255, 23/255, 1);
  function setCol(i, on, ph) { const a = on ? (ph ? COL_ONPH : COL_ON) : (ph ? COL_PH : COL_OFF); cols[i*3] = a[0]/255; cols[i*3+1] = a[1]/255; cols[i*3+2] = a[2]/255; }
  function draw() { gl.bindBuffer(gl.ARRAY_BUFFER, colb); gl.bufferSubData(gl.ARRAY_BUFFER, 0, cols); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, cells); }
  return {
    full(on, phCol) { for (let i = 0; i < cells; i++) setCol(i, on[i], (i % L.cols) === phCol); draw(); },
    incremental(on, phCol, prevCol, changed) {
      for (const i of changed) setCol(i, on[i], (i % L.cols) === phCol);
      for (let r = 0; r < L.rows; r++) { setCol(r * L.cols + prevCol, on[r * L.cols + prevCol], false); setCol(r * L.cols + phCol, on[r * L.cols + phCol], true); }
      draw();
    },
  };
}

const RENDERERS = { dom: domRenderer, svg: svgRenderer, canvas: canvasRenderer, webgl: webglRenderer };

function stats(arr) {
  const s = Array.from(arr).sort((a, b) => a - b);
  const n = s.length;
  const q = (p) => s[Math.min(n - 1, Math.floor(p * n))];
  const mean = s.reduce((a, b) => a + b, 0) / n;
  return { n, mean: +mean.toFixed(3), p50: +q(0.5).toFixed(3), p95: +q(0.95).toFixed(3), p99: +q(0.99).toFixed(3), max: +s[n - 1].toFixed(3) };
}

// Runs one scenario. mode: 'full' (every cell rewritten every frame, as a naive framework re-render would)
// or 'incremental' (only the playhead column change plus `toggles` random cell toggles per frame).
// Returns JS time per frame (render call only) and rAF-to-rAF interval.
window.runBench = function (tech, cells, mode, frames = 300, warm = 60, toggles = 4) {
  return new Promise((resolve, reject) => {
    let R;
    try { R = RENDERERS[tech](cells); } catch (e) { reject(e); return; }
    const L = layout(cells);
    const on = makeState(cells);
    let phCol = 0, prevCol = 0;
    R.full(on, phCol);
    const js = [], gap = [];
    let last = null, count = 0;
    function frame(ts) {
      prevCol = phCol; phCol = (phCol + 1) % L.cols;
      const changed = [];
      for (let k = 0; k < toggles; k++) { const i = Math.floor(Math.random() * cells); on[i] ^= 1; changed.push(i); }
      const t0 = performance.now();
      if (mode === 'full') R.full(on, phCol); else R.incremental(on, phCol, prevCol, changed);
      const t1 = performance.now();
      if (count >= warm) { js.push(t1 - t0); if (last !== null) gap.push(ts - last); }
      last = ts; count++;
      if (count < warm + frames) requestAnimationFrame(frame); else resolve({ tech, cells, mode, js: stats(js), interval: stats(gap), longFrames: gap.filter(g => g > 20).length });
    }
    requestAnimationFrame(frame);
  });
};

// Style-recalc/layout cost is not inside the render call for DOM/SVG; measure it separately by
// forcing a synchronous layout after the mutation and timing the whole thing.
window.runBenchSync = function (tech, cells, mode, frames = 300, warm = 60, toggles = 4) {
  return new Promise((resolve, reject) => {
    let R;
    try { R = RENDERERS[tech](cells); } catch (e) { reject(e); return; }
    const L = layout(cells);
    const on = makeState(cells);
    let phCol = 0, prevCol = 0;
    R.full(on, phCol);
    const js = [];
    let count = 0;
    function frame() {
      prevCol = phCol; phCol = (phCol + 1) % L.cols;
      const changed = [];
      for (let k = 0; k < toggles; k++) { const i = Math.floor(Math.random() * cells); on[i] ^= 1; changed.push(i); }
      const t0 = performance.now();
      if (mode === 'full') R.full(on, phCol); else R.incremental(on, phCol, prevCol, changed);
      // force style + layout
      void document.getElementById('stage').offsetHeight; void getComputedStyle(document.getElementById('stage').firstChild).width;
      const t1 = performance.now();
      if (count >= warm) js.push(t1 - t0);
      count++;
      if (count < warm + frames) requestAnimationFrame(frame); else resolve({ tech, cells, mode, jsPlusLayout: stats(js) });
    }
    requestAnimationFrame(frame);
  });
};

// ---------- Waveform: Subsample-style 400-bin min/max envelope, redrawn every frame ----------
function makeEnvelope(n = 400) { const mx = new Int8Array(n), mn = new Int8Array(n); for (let i = 0; i < n; i++) { const a = Math.round(127 * Math.abs(Math.sin(i / 17)) * (0.4 + 0.6 * Math.random())); mx[i] = a; mn[i] = -Math.round(a * (0.6 + 0.4 * Math.random())); } return { mx, mn }; }
function wavePoints(env, w, h, phase) {
  const n = env.mx.length, mid = h / 2, half = h * 0.44; const pts = new Array(2 * n);
  for (let i = 0; i < n; i++) { const j = (i + phase) % n; pts[i] = [i * w / (n - 1), mid - (env.mx[j] / 127) * half]; }
  for (let i = n - 1; i >= 0; i--) { const j = (i + phase) % n; pts[2 * n - 1 - i] = [i * w / (n - 1), mid - (env.mn[j] / 127) * half]; }
  return pts;
}
window.runWave = function (tech, frames = 300, warm = 60) {
  return new Promise((resolve) => {
    const W = 1920, H = 256; const stage = document.getElementById('stage'); stage.innerHTML = '';
    const env = makeEnvelope(); let draw;
    if (tech === 'svg') {
      const NS = 'http://www.w3.org/2000/svg'; const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('width', W); svg.setAttribute('height', H);
      const poly = document.createElementNS(NS, 'polygon'); poly.setAttribute('fill', '#3fb950'); svg.appendChild(poly); stage.appendChild(svg);
      draw = (ph) => { poly.setAttribute('points', wavePoints(env, W, H, ph).map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ')); };
    } else {
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H; stage.appendChild(cv); const ctx = cv.getContext('2d');
      draw = (ph) => { ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H); const pts = wavePoints(env, W, H, ph); ctx.fillStyle = '#3fb950'; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); };
    }
    const js = [], gap = []; let last = null, count = 0;
    function frame(ts) { const t0 = performance.now(); draw(count); if (tech === 'svg') { void stage.offsetHeight; } const t1 = performance.now(); if (count >= warm) { js.push(t1 - t0); if (last !== null) gap.push(ts - last); } last = ts; count++; if (count < warm + frames) requestAnimationFrame(frame); else resolve({ tech, scenario: 'waveform-400bin-1920x256', js: stats(js), interval: stats(gap), longFrames: gap.filter(g => g > 20).length }); }
    requestAnimationFrame(frame);
  });
};
// ---------- Mixed page: four 16x8 DOM grids (512 cells, incremental), eight faders moved by transform, one canvas waveform ----------
window.runPage = function (frames = 300, warm = 60) {
  return new Promise((resolve) => {
    const stage = document.getElementById('stage'); stage.innerHTML = '';
    const wrap = document.createElement('div'); wrap.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 256px;width:1920px;height:1080px;gap:8px';
    const grids = [];
    for (let g = 0; g < 4; g++) {
      const grid = document.createElement('div'); grid.className = 'grid'; grid.style.gridTemplateColumns = 'repeat(16,1fr)'; grid.style.gridTemplateRows = 'repeat(8,1fr)';
      const els = []; for (let i = 0; i < 128; i++) { const d = document.createElement('div'); d.className = 'cell' + (Math.random() < 0.3 ? ' on' : ''); grid.appendChild(d); els.push(d); }
      wrap.appendChild(grid); grids.push(els);
    }
    const bottom = document.createElement('div'); bottom.style.cssText = 'grid-column:1/3;display:flex;gap:8px';
    const faders = []; for (let f = 0; f < 8; f++) { const t = document.createElement('div'); t.style.cssText = 'width:60px;height:256px;background:#161b22;position:relative;overflow:hidden'; const k = document.createElement('div'); k.style.cssText = 'position:absolute;left:0;width:60px;height:24px;background:#58a6ff;will-change:transform'; t.appendChild(k); bottom.appendChild(t); faders.push(k); }
    const cv = document.createElement('canvas'); cv.width = 1300; cv.height = 256; bottom.appendChild(cv); const ctx = cv.getContext('2d'); const env = makeEnvelope();
    wrap.appendChild(bottom); stage.appendChild(wrap);
    const on = grids.map(() => Array.from({ length: 128 }, () => Math.random() < 0.3));
    let col = 0; const js = [], gap = []; let last = null, count = 0;
    function frame(ts) {
      const t0 = performance.now(); const prev = col; col = (col + 1) % 16;
      for (let g = 0; g < 4; g++) { const els = grids[g]; for (let r = 0; r < 8; r++) { const a = r * 16 + prev, b = r * 16 + col; els[a].className = 'cell' + (on[g][a] ? ' on' : ''); els[b].className = 'cell' + (on[g][b] ? ' on' : '') + ' ph'; } const i = Math.floor(Math.random() * 128); on[g][i] = !on[g][i]; els[i].className = 'cell' + (on[g][i] ? ' on' : '') + ((i % 16) === col ? ' ph' : ''); }
      for (let f = 0; f < 8; f++) faders[f].style.transform = `translateY(${Math.round(116 + 116 * Math.sin((count + f * 20) / 30))}px)`;
      ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, 1300, 256); const pts = wavePoints(env, 1300, 256, count); ctx.fillStyle = '#3fb950'; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill();
      void stage.offsetHeight;
      const t1 = performance.now(); if (count >= warm) { js.push(t1 - t0); if (last !== null) gap.push(ts - last); } last = ts; count++;
      if (count < warm + frames) requestAnimationFrame(frame); else resolve({ scenario: 'mixed-page-512cells-8faders-waveform', js: stats(js), interval: stats(gap), longFrames: gap.filter(g => g > 20).length });
    }
    requestAnimationFrame(frame);
  });
};
</script>
</body>
</html>
